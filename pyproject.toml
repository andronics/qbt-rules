[project]
name = "qbt-rules"
# Owned by release-please: never edit by hand (see the wiki's Release-Process page).
version = "0.10.2"
description = "A rules engine for qBittorrent automation, with a job queue, scheduler and web dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = "Unlicense"
dependencies = [
    "interpose @ git+https://github.com/metalayerlab/interpose@v0.2.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # The dashboard's templates (Jinja2Templates), and the signed session cookie
    # (Starlette's SessionMiddleware)
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    # qBittorrent's Web API, the scheduler's cron expressions, the trackie client
    "qbittorrent-api>=2024.12.0",
    "croniter>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# The Redis queue backend (the image installs it: Copier answer image_extras)
redis = ["redis>=5.0"]
# TODO(4e): interpose's metrics replace prometheus_client
metrics = ["prometheus-client>=0.20"]

[project.scripts]
# TODO(4f): the Typer CLI in qbt_rules.cli takes over; until then the legacy argparse CLI
# answers, and takes `serve` as a synonym of `--serve` (uvicorn and the FastAPI app).
qbt-rules = "qbt_rules.legacy_cli:main"

[project.urls]
Homepage = "https://github.com/andronics/qbt-rules"
Documentation = "https://github.com/andronics/qbt-rules/wiki"
Changelog = "https://github.com/andronics/qbt-rules/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml",
    "httpx2>=2.0",
    "pytest-mock>=3.12",
    "fakeredis[lua]>=2.20",
    "requests-mock>=1.11",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "types-requests>=2.31",
    "types-croniter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbt_rules"]

[tool.hatch.metadata]
# interpose is pinned by its git URL, not PyPI (template-python decision 0003)
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; scripts print, and run git, by design.
"tests/*" = ["S101"]
"scripts/*" = ["T20", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src/qbt_rules", "tests", "scripts"]

# TODO(#35): the tests from before the template migration don't annotate their test
# functions and fixtures (about 1,850 of them). Only these modules, and only the
# annotation rules: their bodies are still checked (check_untyped_defs). A module
# leaves this list once it's annotated; new test modules are never added to it.
[[tool.mypy.overrides]]
module = [
    "tests.conftest",
    "tests.golden.test_api_goldens",
    "tests.unit.test_advanced_example",
    "tests.unit.test_arguments",
    "tests.unit.test_cli_ui",
    "tests.unit.test_config_store",
    "tests.unit.test_engine.test_action_executor",
    "tests.unit.test_engine.test_arr_actions",
    "tests.unit.test_engine.test_condition_evaluator",
    "tests.unit.test_engine.test_file_priority_action",
    "tests.unit.test_engine.test_notify_action",
    "tests.unit.test_engine.test_rules_engine",
    "tests.unit.test_engine.test_tracker_fields",
    "tests.unit.test_errors",
    "tests.unit.test_full_stack",
    "tests.unit.test_legacy_cli",
    "tests.unit.test_log_setup",
    "tests.unit.test_metrics",
    "tests.unit.test_qbittorrent",
    "tests.unit.test_queue_manager",
    "tests.unit.test_redis_queue",
    "tests.unit.test_resolver",
    "tests.unit.test_resolver_e2e",
    "tests.unit.test_resolver_edge_cases",
    "tests.unit.test_resolver_integration",
    "tests.unit.test_rule_execution",
    "tests.unit.test_rules_validation",
    "tests.unit.test_scheduler",
    "tests.unit.test_scheduler_integration",
    "tests.unit.test_schema",
    "tests.unit.test_sqlite_queue",
    "tests.unit.test_utils",
    "tests.unit.test_worker",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = [
    "integration: talks to real external systems; deselect with -m 'not integration'",
    "redis: needs a real Redis server (skipped without one)",
]
# A deprecation fails the dependency bump that brings it, not a later run.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["qbt_rules"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
