<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}qbt-rules{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8; --fg: #1a1a1a; --card-bg: #fff; --border: #e0e0e0;
      --accent: #2563eb; --muted: #6b7280;
      --ok: #16a34a; --warn: #ca8a04; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #e5e5e5; --card-bg: #1c1c1e; --border: #333333; --muted: #9ca3af; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    nav { display: flex; gap: 1rem; }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    nav a.active, nav a:hover { color: var(--accent); }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .card h2 { margin-top: 0; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(37, 99, 235, 0.06); }
    a { color: var(--accent); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-completed { background: rgba(22, 163, 74, 0.15); color: var(--ok); }
    .badge-failed { background: rgba(220, 38, 38, 0.15); color: var(--err); }
    .badge-pending, .badge-processing { background: rgba(202, 138, 4, 0.15); color: var(--warn); }
    .badge-cancelled { background: rgba(107, 114, 128, 0.15); color: var(--muted); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
    .stat { text-align: center; }
    .stat .value { font-size: 1.6rem; font-weight: 700; }
    .stat .label { font-size: 0.8rem; color: var(--muted); }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .pagination { display: flex; gap: 1rem; align-items: center; margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>qbt-rules</h1>
    <nav>
      <a href="{{ url_for('dashboard_overview', key=api_key) }}" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
      <a href="{{ url_for('dashboard_jobs', key=api_key) }}" class="{{ 'active' if active == 'jobs' else '' }}">Jobs</a>
      <a href="{{ url_for('dashboard_rules', key=api_key) }}" class="{{ 'active' if active == 'rules' else '' }}">Rules</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
