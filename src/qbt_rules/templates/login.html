<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - qbt-rules</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-app: #0a0c11; --bg-panel: #12151c; --bg-panel-2: #171b25;
      --border: #262b38; --border-strong: #3a4152;
      --fg: #e7e9f0; --fg-dim: #aab0c0; --muted: #747c90;
      --accent: #5b8cff; --danger: #f43f5e;
      --radius: 10px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg-app: #eef0f4; --bg-panel: #ffffff; --bg-panel-2: #f5f6f9;
        --border: #dbdfe8; --border-strong: #c2c8d6;
        --fg: #161a22; --fg-dim: #454d5e; --muted: #6b7280;
        --accent: #2f5ce0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-ui); background: var(--bg-app); color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      width: 100%; max-width: 340px; background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .login-card .brand { font-size: 1rem; font-weight: 600; margin-bottom: .25rem; }
    .login-card .sub { font-size: .8rem; color: var(--muted); margin-bottom: 1.25rem; font-family: var(--font-mono); }
    .login-card label { display: block; font-size: .78rem; color: var(--fg-dim); margin-bottom: .35rem; }
    .login-card input[type="password"] {
      width: 100%; padding: .55rem .65rem; background: var(--bg-panel-2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--fg); font-family: var(--font-mono); font-size: .85rem; margin-bottom: 1rem;
    }
    .login-card input[type="password"]:focus { outline: 1.5px solid var(--accent); border-color: var(--accent); }
    .login-card button {
      width: 100%; padding: .6rem; background: var(--accent); border: none; border-radius: 7px;
      color: #fff; font-weight: 600; font-size: .85rem; cursor: pointer; font-family: inherit;
    }
    .login-card button:hover { filter: brightness(1.08); }
    .error {
      background: rgba(244,63,94,.12); border: 1px solid var(--danger); color: var(--danger);
      border-radius: 7px; padding: .5rem .65rem; font-size: .78rem; margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">qbt-rules</div>
    <div class="sub">dashboard sign-in</div>
    {% if error %}<div class="error">Invalid API key.</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="key">API key</label>
      <input type="password" id="key" name="key" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
