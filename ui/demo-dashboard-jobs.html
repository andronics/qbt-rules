<!--
  qbt-rules :: Jobs dashboard — concept demo (vanilla HTML/CSS/JS, no frameworks, no
  external requests). Visually forked from demo-metrics-config-dashboard.html /
  demo-rule-builder-params.html: same dark-first :root color system, topbar/brand
  treatment, .panel/.stat-card/.badge components.

  WHAT THIS DEMO IS: a richer evolution of the real, currently-shipped, read-only
  /dashboard/jobs + /dashboard/jobs/<id> routes (src/qbt_rules/templates/jobs.html +
  job_detail.html + base.html; handlers in server.py's dashboard_jobs()/
  dashboard_job_detail(), ~L473-509). Same underlying fields as the real templates —
  job_id / status / context / hash / created_at / started_at / completed_at / result /
  error — presented as a denser table with a working client-side status filter +
  pager, and a detail view (click a row) matching job_detail.html's two-tier error
  presentation: a short summary line plus an expandable full traceback.

  This is a STATIC concept demo: all job data below is MOCK, but the shapes, field
  names, status values (pending/processing/completed/failed/cancelled), and context
  strings are the real ones (context strings like "added"/"hourly"/"weekly"/"none"
  mirror actual qbt-rules usage). The status filter and pager operate for real against
  this in-page mock array (no backend, nothing persists) — it's not a fake affordance,
  just not wired to a live server.

  JUDGMENT CALLS:
  - List <-> detail is an in-page content swap (renderJobsList() / renderJobDetail()),
    mirroring the real app's separate /dashboard/jobs vs /dashboard/jobs/<id> routes
    without actually round-tripping pages, since this is a single static file.
  - Top nav: "Jobs" is the current page (not a link). Overview/Rules/Metrics are real
    <a href> links to the sibling concept demos in this same directory
    (demo-dashboard-overview.html, demo-dashboard-rules.html,
    demo-metrics-config-dashboard.html) — not inert stubs, per this round's brief.
  - The failed-job example's traceback uses this project's own bulleted
    ConnectionError format (see src/qbt_rules/errors.py) ending the traceback chain,
    matching how _summarize_error() in server.py actually extracts a short summary
    from a real traceback (last zero-indent exception line(s) to the end of the
    string) — not a generic/invented error shape.
  - No cancel/retry actions on pending/processing rows: those would imply a live
    DELETE /api/jobs/<id> call, out of scope for a static read-only demo.
  - Added a docked rules.yml/config.yml YAML panel, copied verbatim (CSS, colorizer,
    excerpt content) from demo-metrics-config-dashboard.html, hidden by default (a
    "YAML ◂" toggle in the topbar / collapsed tab on the workspace edge opens it) —
    all four dashboard concept pages now offer the same reference panel. Required
    converting the page shell from natural page-scroll (body min-height:100vh) to a
    fixed-height app shell (body overflow:hidden, #app height:100vh) so the panel and
    `.dash` can each scroll independently, matching the other demos' shells.

  NOT part of this demo: no rule visuals (that's demo-dashboard-rules.html's concern),
  no live data fetching.
-->

/* Same summary extraction rule as server.py's _summarize_error(): the final
   zero-indent "SomeError: message" line onward, falling back to the last
   non-empty line if it doesn't look like a traceback. */
function summarizeError(trace){
  const lines = trace.split('\n');
  let lastZeroIndent = -1;
  lines.forEach((line, i) => { if(/^\S/.test(line) && line.trim()) lastZeroIndent = i; });
  if(lastZeroIndent >= 0){
    return lines.slice(lastZeroIndent).join('\n').trim();
  }
  const nonEmpty = lines.filter(l => l.trim());
  return nonEmpty[nonEmpty.length - 1] || trace;
}

/* ======================================================================
   State: current view ('list' | 'detail'), filter, page
   ====================================================================== */
let state = { view:'list', statusFilter:'', page:0, selectedId:null };

function filteredJobs(){
  return state.statusFilter ? MOCK_JOBS.filter(j => j.status === state.statusFilter) : MOCK_JOBS;
}

/* ======================================================================
   List view
   ====================================================================== */
function renderJobsList(){
  const all = filteredJobs();
  const total = all.length;
  const start = state.page * PAGE_SIZE;
  const pageJobs = all.slice(start, start + PAGE_SIZE);

  const rows = pageJobs.length ? pageJobs.map(j => `
    <tr data-id="${escapeHtml(j.job_id)}">
      <td class="mono jid">${escapeHtml(j.job_id.slice(0,8))}&hellip;</td>
      <td><span class="badge ${j.status}">${j.status}</span></td>
      <td>${escapeHtml(j.context || 'none')}</td>
      <td class="mono">${escapeHtml(j.created_at)}</td>
    </tr>`).join('') : '';

  document.getElementById('dash').innerHTML = `
    <div class="dash-section">
      <h3>Jobs <span class="src">/dashboard/jobs</span></h3>
      <div class="panel">
        <div class="jobs-toolbar">
          <div class="filter-row">
            <label for="statusFilter">Status</label>
            <select id="statusFilter">
              <option value="">All</option>
              <option value="pending">pending</option>
              <option value="processing">processing</option>
              <option value="completed">completed</option>
              <option value="failed">failed</option>
              <option value="cancelled">cancelled</option>
            </select>
          </div>
          <div class="pager">
            <span>Showing ${pageJobs.length ? start+1 : 0}&ndash;${start+pageJobs.length} of ${total}</span>
            <button id="btnPrev" ${state.page===0?'disabled':''}>&larr; Previous</button>
            <button id="btnNext" ${start+PAGE_SIZE>=total?'disabled':''}>Next &rarr;</button>
          </div>
        </div>
        ${pageJobs.length ? `
        <table class="jtable">
          <thead><tr><th>Job ID</th><th>Status</th><th>Context</th><th>Created</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty">No jobs found${state.statusFilter ? ` with status "${escapeHtml(state.statusFilter)}"` : ''}.</div>`}
      </div>
    </div>`;

  document.getElementById('statusFilter').value = state.statusFilter;
  document.getElementById('statusFilter').addEventListener('change', e => {
    state.statusFilter = e.target.value; state.page = 0; renderJobsList();
  });
  const prevBtn = document.getElementById('btnPrev');
  const nextBtn = document.getElementById('btnNext');
  if(prevBtn) prevBtn.addEventListener('click', () => { state.page = Math.max(0, state.page-1); renderJobsList(); });
  if(nextBtn) nextBtn.addEventListener('click', () => { state.page += 1; renderJobsList(); });
  document.querySelectorAll('table.jtable tbody tr').forEach(tr => {
    tr.addEventListener('click', () => { state.view='detail'; state.selectedId = tr.dataset.id; renderCurrentView(); });
  });
}

/* ======================================================================
   Detail view — mirrors job_detail.html's Status/Context/Hash/Created/
   Started/Completed table + conditional Result / Error cards
   ====================================================================== */
function renderJobDetail(){
  const job = MOCK_JOBS.find(j => j.job_id === state.selectedId);
  if(!job){
    document.getElementById('dash').innerHTML = `<div class="dash-section"><div class="empty">Job not found: ${escapeHtml(state.selectedId||'')}</div></div>`;
    return;
  }

  const resultRows = job.result ? Object.entries(job.result).map(([k,v]) =>
    `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(String(v))}</td></tr>`).join('') : '';

  let errorBlock = '';
  if(job.error){
    const summary = summarizeError(job.error);
    const hasMore = summary !== job.error.trim();
    errorBlock = `
      <div class="dash-section">
        <h3>Error</h3>
        <div class="panel">
          <div class="err-summary">${escapeHtml(summary)}</div>
          ${hasMore ? `<details class="trace"><summary>Show full traceback</summary><pre>${escapeHtml(job.error)}</pre></details>` : ''}
        </div>
      </div>`;
  }

  document.getElementById('dash').innerHTML = `
    <button class="back-link" id="btnBack">&larr; Back to jobs</button>
    <div class="dash-section">
      <h3>Job <span class="src">${escapeHtml(job.job_id)}</span></h3>
      <div class="panel">
        <table class="kv-table">
          <tr><th>Status</th><td><span class="badge ${job.status}">${job.status}</span></td></tr>
          <tr><th>Context</th><td>${escapeHtml(job.context || 'none')}</td></tr>
          <tr><th>Hash</th><td>${escapeHtml(job.hash || 'all torrents')}</td></tr>
          <tr><th>Created</th><td>${escapeHtml(job.created_at)}</td></tr>
          <tr><th>Started</th><td>${escapeHtml(job.started_at || 'not started')}</td></tr>
          <tr><th>Completed</th><td>${escapeHtml(job.completed_at || 'not completed')}</td></tr>
        </table>
      </div>
    </div>
    ${job.result ? `
    <div class="dash-section">
      <h3>Result</h3>
      <div class="panel"><table class="kv-table">${resultRows}</table></div>
    </div>` : ''}
    ${errorBlock}`;

  document.getElementById('btnBack').addEventListener('click', () => { state.view='list'; renderCurrentView(); });
}

function renderCurrentView(){
  if(state.view === 'detail') renderJobDetail();
  else renderJobsList();
}

/* ======================================================================
   YAML panel — verbatim from demo-metrics-config-dashboard.html: same
   colorizer, same rules.yml/config.yml excerpts, hidden by default here too.
   ====================================================================== */
function colorizeYamlLine(text){
  const hashIdx = text.indexOf('#');
  let code = text, comment = '';
  if(hashIdx >= 0){ code = text.slice(0,hashIdx); comment = text.slice(hashIdx); }

  const leadMatch = code.match(/^(\s*(?:-\s*)?)/);
  const lead = leadMatch ? leadMatch[0] : '';
  let rest = code.slice(lead.length);
  let out = escapeHtml(lead);

  const kvMatch = rest.match(/^([A-Za-z_][\w.]*)\s*:\s*(.*)$/);
  if(kvMatch){
    const key = kvMatch[1], val = kvMatch[2];
    out += `<span class="yk">${escapeHtml(key)}</span><span class="yp">:</span>` + (val ? ' ' + colorizeValue(val) : '');
  } else if(rest.trim().startsWith('$ref:')){
    const afterColon = rest.trim().slice(5).trim();
    out += `<span class="yr">$ref</span><span class="yp">:</span> <span class="yr">${escapeHtml(afterColon)}</span>`;
  } else {
    out += colorizeValue(rest);
  }
  if(comment) out += `<span class="yc">${escapeHtml(comment)}</span>`;
  return out;
}
function colorizeValue(v){
  const t = v.trim();
  if(!t) return '';
  if(t.startsWith('$ref:')) return `<span class="yr">${escapeHtml(t)}</span>`;
  if(/\$\{[^}]+\}/.test(t)){
    const parts = t.split(/(\$\{[^}]+\})/g);
    return parts.map(p => /^\$\{[^}]+\}$/.test(p) ? `<span class="yr">${escapeHtml(p)}</span>` : colorizeValuePlain(p)).join('');
  }
  return colorizeValuePlain(t);
}
function colorizeValuePlain(t){
  if(!t) return '';
  if(/^["'].*["']$/.test(t)) return `<span class="ys">${escapeHtml(t)}</span>`;
  if(/^-?\d+(\.\d+)?$/.test(t)) return `<span class="yn">${escapeHtml(t)}</span>`;
  if(/^(true|false)$/.test(t)) return `<span class="yn">${escapeHtml(t)}</span>`;
  if(t.startsWith('[') || t.startsWith('{')) return `<span class="yp">${escapeHtml(t)}</span>`;
  return escapeHtml(t);
}
function renderYamlLines(text){
  return text.split('\n').map(line => `<div class="yline">${colorizeYamlLine(line)}</div>`).join('');
}

// Real excerpt: advanced-rules-example.yml — refs.vars, refs.conditions (trimmed to the

// file is 473 lines; every other ui/demo-*.html uses this same example set.
const RULES_YML = `# Advanced qBittorrent Rules Configuration with Resolver Layer
# Demonstrates comprehensive use of refs with 30+ reusable components and 10 complex rules
#
# (excerpt — full file is advanced-rules-example.yml, 473 lines, 10 rules total)

refs:
  vars:
    min_ratio_private: 2.0          # Private trackers require higher ratios
    min_ratio_public: 1.0           # Public trackers are more lenient
    excellent_ratio: 5.0            # Consider this "well seeded"
    completion_age_short: "7 days"
    completion_age_medium: "30 days"
    completion_age_long: "90 days"
    large_file_bytes: 53687091200   # 50 GB
    huge_file_bytes: 107374182400   # 100 GB
    protected_categories:
      - keep
      - seedbox
      - long-term
      - permanent
      - archive
    hd_content_pattern: '(?i).*(1080p|2160p|4k|uhd|bluray|remux).*'
    tv_show_pattern: '(?i).*(s\\d{2}e\\d{2}|season[\\s._-]*\\d+).*'

  conditions:
    private-tracker:
      any:
        - field: trackers.url
          operator: contains
          value: "privatehd.to"
        - field: trackers.url
          operator: contains
          value: "torrentleech.org"
        - field: trackers.url
          operator: contains
          value: "iptorrents.com"

    well-seeded-private:
      all:
        - field: info.ratio
          operator: ">="
          value: \${vars.min_ratio_private}
        - field: info.completion_on
          operator: older_than
          value: \${vars.completion_age_medium}

    under-seeded-private:
      all:
        - field: info.ratio
          operator: "<"
          value: \${vars.min_ratio_private}
        - field: info.state
          operator: in
          value:
            - uploading
            - stalledUP
            - queuedUP

    hd-content:
      all:
        - field: info.name
          operator: matches
          value: \${vars.hd_content_pattern}

rules:
  # Rule 1: Private Tracker Under-Seeding Emergency
  - name: "Force seed private tracker torrents under ratio"
    enabled: true
    context: download-finished
    stop_on_match: false
    conditions:
      - $ref: conditions.private-tracker
      - $ref: conditions.under-seeded-private
      - none:
          - $ref: conditions.protected-content
    actions:
      - $ref: actions.force-seed-private

  # Rule 2: Private Tracker Cleanup - Well Seeded
  - name: "Cleanup well-seeded private tracker torrents"
    enabled: true
    context: weekly-cleanup
    conditions:
      - $ref: conditions.private-tracker
      - $ref: conditions.well-seeded-private
      - none:
          - $ref: conditions.protected-content
    actions:
      - $ref: actions.safe-delete

  # Rule 3: Public Tracker Quick Cleanup
  - name: "Cleanup public tracker torrents after medium term"
    enabled: true
    context: weekly-cleanup
    conditions:
      - $ref: conditions.public-tracker
      - $ref: conditions.well-seeded-public
      - none:
          - $ref: conditions.protected-content
          - $ref: conditions.hd-content
    actions:
      - $ref: actions.safe-delete

  # Rule 4: HD Content Auto-Organization
  - name: "Auto-categorize and prioritize HD content from private trackers"
    enabled: true
    context: torrent-imported
    stop_on_match: false
    conditions:
      - $ref: conditions.private-tracker
      - $ref: conditions.hd-content
      - any:
          - $ref: conditions.tv-show
          - $ref: conditions.movie
    actions:
      - $ref: actions.process-hd-content
`;
